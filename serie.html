<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Série – Império do Streaming</title>
  <style>
    :root {
      --bg: #0b0b12;
      --card: #141422;
      --card2: #1a1a2e;
      --primary: #e50914;
      --purple: #7c3aed;
      --text: #eee;
      --muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 4%; flex-wrap: wrap; gap: 12px;
      border-bottom: 1px solid #1f1f2e;
      background: #0a0a10;
    }
    .logo { color: var(--primary); font-weight: 800; font-size: 1.15rem; letter-spacing: 0.5px; text-decoration: none; }
    .nav { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .nav a {
      text-decoration: none; color: #fff; font-size: 0.85rem; font-weight: 600;
      padding: 8px 14px; border-radius: 20px; background: #2a2a3a;
      transition: 0.15s;
    }
    .nav a:hover { opacity: 0.9; transform: translateY(-1px); }
    .nav a.fb { background: #1877F2; }
    .nav a.wa { background: #25D366; }
    .nav a.cta { background: var(--primary); }
    .nav a.vid { background: #3b82f6; }
    .nav a.gal { background: #8b5cf6; }

    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 4% 60px; }
    .back {
      display: inline-flex; align-items: center; gap: 6px;
      background: #252538; color: #fff; border: none; border-radius: 20px;
      padding: 8px 16px; font-weight: 600; font-size: 0.85rem; cursor: pointer;
      text-decoration: none; margin-bottom: 22px;
    }
    .back:hover { background: #33334a; }

    .hero-row {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 28px;
      margin-bottom: 28px;
    }
    @media (max-width: 700px) {
      .hero-row { grid-template-columns: 1fr; }
      .poster { max-width: 220px; margin: 0 auto; }
    }
    .poster {
      width: 100%; border-radius: 12px; overflow: hidden;
      background: #1a1a28; border: 1px solid #2a2a3a;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }
    .poster img { width: 100%; display: block; aspect-ratio: 2/3; object-fit: cover; }
    .meta-side { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
    .meta-chip {
      background: var(--card); border: 1px solid #2a2a3a; border-radius: 10px;
      padding: 10px 14px; font-size: 0.85rem; color: var(--muted);
    }
    .meta-chip strong { color: #fff; display: block; font-size: 0.75rem; letter-spacing: 0.5px; margin-bottom: 2px; }
    .btn-galeria {
      display: block; text-align: center; text-decoration: none;
      background: #3b82f6; color: #fff; font-weight: 700; border-radius: 10px;
      padding: 12px 16px; margin-top: 6px;
    }
    .btn-galeria:hover { filter: brightness(1.08); }

    h1 { font-size: 2rem; margin-bottom: 10px; }
    .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; color: var(--muted); font-size: 0.9rem; }
    .badge-serie {
      background: var(--purple); color: #fff; font-size: 0.7rem; font-weight: 800;
      padding: 4px 10px; border-radius: 6px; letter-spacing: 0.5px;
    }
    .synopsis { color: #c4c4d4; line-height: 1.55; margin-bottom: 22px; max-width: 640px; }

    .seasons { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
    .season-pill {
      background: var(--purple); color: #fff; border: none; border-radius: 12px;
      padding: 12px 16px; cursor: pointer; text-align: left; min-width: 90px;
    }
    .season-pill:not(.active) { background: #252538; }
    .season-pill small { display: block; opacity: 0.85; font-size: 0.75rem; margin-top: 2px; }

    .eps-title { font-size: 0.8rem; color: var(--muted); letter-spacing: 1px; margin-bottom: 12px; font-weight: 700; }
    .ep-card {
      display: flex; gap: 14px; align-items: flex-start;
      background: var(--card2); border: 1px solid #2a2a3a; border-radius: 14px;
      padding: 14px; margin-bottom: 12px; cursor: pointer; transition: 0.15s;
    }
    .ep-card:hover { border-color: var(--purple); background: #1e1e32; }
    .ep-play {
      flex-shrink: 0; width: 42px; height: 42px; border-radius: 50%;
      background: var(--purple); display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 16px;
    }
    .ep-thumb {
      width: 96px; height: 56px; border-radius: 8px; object-fit: cover;
      background: #111; flex-shrink: 0; border: 1px solid #333;
    }
    .ep-thumb-ph {
      width: 96px; height: 56px; border-radius: 8px; background: #1a1a28;
      display: flex; align-items: center; justify-content: center; color: #555; font-size: 11px;
      flex-shrink: 0; border: 1px solid #333;
    }
    .ep-body { flex: 1; min-width: 0; }
    .ep-body h3 { font-size: 1rem; margin-bottom: 4px; }
    .ep-body p { font-size: 0.85rem; color: var(--muted); line-height: 1.4; }
    .ep-num {
      flex-shrink: 0; background: #2a2a3a; color: #ccc; font-size: 0.75rem; font-weight: 700;
      padding: 6px 10px; border-radius: 8px; align-self: center;
    }

    .status { text-align: center; color: var(--muted); padding: 40px 20px; }
    .status.error { color: #f87171; }

    /* Player modal */
    #player-modal {
      display: none; position: fixed; inset: 0; z-index: 9999;
      background: rgba(0,0,0,0.92); align-items: center; justify-content: center;
      padding: 16px;
    }
    #player-modal.show { display: flex; }
    .player-box {
      width: 100%; max-width: 960px; background: #111; border-radius: 12px;
      overflow: hidden; border: 1px solid #333;
    }
    .player-box header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; border-bottom: 1px solid #222; background: #0a0a0a;
    }
    .player-box header h3 { font-size: 1rem; }
    .player-box header button {
      background: #333; color: #fff; border: none; border-radius: 8px;
      padding: 6px 12px; cursor: pointer; font-weight: 600;
    }
    .player-box video { width: 100%; max-height: 70vh; background: #000; display: block; }

    .ads-section { margin-top: 36px; }
    .ads-section h3 { font-size: 0.75rem; color: var(--muted); letter-spacing: 1px; margin-bottom: 12px; text-align: center; }
    .ads-grid-page {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    }
    @media (max-width: 700px) { .ads-grid-page { grid-template-columns: repeat(2, 1fr); } }
    .ads-grid-page .ad-slot {
      border-radius: 8px; overflow: hidden; background: #1a1a28;
      border: 1px solid #2a2a3a; aspect-ratio: 3/2;
    }
    .ads-grid-page .ad-slot a { display: block; width: 100%; height: 100%; }
    .ads-grid-page .ad-slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ads-row {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
      margin-top: 40px;
    }
    @media (max-width: 700px) { .ads-row { grid-template-columns: repeat(2, 1fr); } }
    .ads-row img { width: 100%; border-radius: 8px; display: block; }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/">IMPÉRIO DO STREAMING</a>
    <nav class="nav">
      <a href="/">Home</a>
      <a class="fb" href="https://www.facebook.com/imperiodostreaming" target="_blank" rel="noopener">Facebook</a>
      <a class="wa" href="https://wa.me/5547988307184?text=Ol%C3%A1!%20Vim%20pelo%20site." target="_blank" rel="noopener">WhatsApp</a>
      <a class="cta" href="/#cadastro">Testar Agora</a>
      <a class="vid" href="/vlog.html">Vídeos</a>
      <a class="gal" href="/galeria.html?id=super-stream">Galeria</a>
    </nav>
  </header>

  <div class="wrap">
    <a class="back" href="/vlog.html">← VOLTAR</a>
    <div id="content" class="status">Carregando série...</div>
  </div>

  <section class="ads-section" id="ads-section-serie" style="display:none;max-width:1100px;margin:0 auto 40px;padding:0 4%;">
    <h3>PUBLICIDADE</h3>
    <div class="ads-grid-page" id="ads-grid-serie"></div>
  </section>

  <div id="player-modal">
    <div class="player-box">
      <header>
        <h3 id="player-title">Episódio</h3>
        <button type="button" onclick="fecharPlayer()">Fechar</button>
      </header>
      <video id="player-video" controls playsinline></video>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      authDomain: "imperio-25340.firebaseapp.com",
      projectId: "imperio-25340",
      storageBucket: "imperio-25340.appspot.com",
      messagingSenderId: "305282928509",
      appId: "1:305282928509:web:5d2edc0b6238b1f50a4ad6"
    };

    // Usa config pública do site se existir no index; fallback leitura REST
    const params = new URLSearchParams(location.search);
    const serieId = (params.get("id") || "super-stream").toLowerCase().replace(/[^a-z0-9\-]/g, "-");

    let activeSeason = 0;
    let serieData = null;

    async function loadViaRest() {
      const base = "https://firestore.googleapis.com/v1/projects/imperio-25340/databases/(default)/documents";
      // series/{id}
      let r = await fetch(base + "/series/" + encodeURIComponent(serieId));
      if (r.ok) {
        const j = await r.json();
        return parseRestDoc(j);
      }
      // fallback config/vlog
      r = await fetch(base + "/config/vlog");
      if (r.ok) {
        const j = await r.json();
        const data = parseRestDoc(j);
        if (data && data.series) return data.series;
        return data;
      }
      return null;
    }

    function parseRestDoc(j) {
      if (!j || !j.fields) return null;
      return fromRestFields(j.fields);
    }

    function fromRestFields(fields) {
      const out = {};
      for (const [k, v] of Object.entries(fields || {})) {
        out[k] = fromRestValue(v);
      }
      return out;
    }

    function fromRestValue(v) {
      if (v == null) return null;
      if ("stringValue" in v) return v.stringValue;
      if ("integerValue" in v) return parseInt(v.integerValue, 10);
      if ("doubleValue" in v) return Number(v.doubleValue);
      if ("booleanValue" in v) return !!v.booleanValue;
      if ("nullValue" in v) return null;
      if ("arrayValue" in v) return (v.arrayValue.values || []).map(fromRestValue);
      if ("mapValue" in v) return fromRestFields(v.mapValue.fields || {});
      return null;
    }

    // Tenta SDK com config embutida do hosting (mesma do admin/index)
    async function loadSerie() {
      try {
        let app;
        try {
          const cfgRes = await fetch("/__/firebase/init.json");
          if (cfgRes.ok) app = initializeApp(await cfgRes.json());
        } catch (_) {}
        if (!app) app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const snap = await getDoc(doc(db, "series", serieId));
        if (snap.exists()) return { id: snap.id, ...snap.data() };
        const vlog = await getDoc(doc(db, "config", "vlog"));
        if (vlog.exists() && vlog.data().series) return { id: serieId, ...vlog.data().series };
      } catch (e) {
        console.warn("SDK fail, REST:", e);
      }
      return await loadViaRest();
    }

    function esc(s) {
      return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    function render() {
      const el = document.getElementById("content");
      if (!serieData) {
        el.className = "status error";
        el.innerHTML = "Série não encontrada.<br><a href='/vlog.html' style='color:#8b5cf6'>Voltar ao catálogo</a>";
        return;
      }
      el.className = "";
      document.title = (serieData.title || serieId) + " – Império do Streaming";

      const seasons = Array.isArray(serieData.seasons) ? serieData.seasons : [];
      if (!seasons.length) {
        seasons.push({ name: "TP 1", episodes: [] });
      }
      if (activeSeason >= seasons.length) activeSeason = 0;
      const se = seasons[activeSeason];
      const eps = se.episodes || [];

      const poster = serieData.poster || "";
      const totalEps = seasons.reduce((n, s) => n + ((s.episodes || []).length), 0);

      el.innerHTML = `
        <div class="hero-row">
          <div>
            <div class="poster">
              ${poster ? `<img src="${esc(poster)}" alt="${esc(serieData.title)}">` : `<div style="aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;color:#555;">Sem poster</div>`}
            </div>
            <div class="meta-side">
              <div class="meta-chip"><strong>📅 ANO</strong>${esc(serieData.year || "—")}</div>
              <div class="meta-chip"><strong>🎬 GÊNEROS</strong>${esc(serieData.genres || "—")}</div>
              <div class="meta-chip"><strong>▶ EPISÓDIOS</strong>${totalEps}</div>
              <a class="btn-galeria" href="/galeria.html?id=${encodeURIComponent(serieId)}">🖼 Galeria de Imagens</a>
            </div>
          </div>
          <div>
            <h1>${esc(serieData.title || serieId)}</h1>
            <div class="badges">
              <span class="badge-serie">SÉRIE</span>
              <span>${esc(serieData.year || "")}</span>
              <span>•</span>
              <span>${esc(serieData.genres || "")}</span>
            </div>
            <p class="synopsis">${esc(serieData.synopsis || "")}</p>

            <div class="seasons">
              ${seasons.map((s, i) => `
                <button type="button" class="season-pill ${i === activeSeason ? "active" : ""}" data-si="${i}">
                  ${esc(s.name || ("TP " + (i + 1)))}
                  <small>${(s.episodes || []).length} episódio${(s.episodes || []).length === 1 ? "" : "s"}</small>
                </button>
              `).join("")}
            </div>

            <div class="eps-title">EPISÓDIOS — ${esc(se.name || "")}</div>
            <div id="eps-list">
              ${eps.length ? eps.map((ep, ei) => `
                <div class="ep-card" data-si="${activeSeason}" data-ei="${ei}">
                  <div class="ep-play">▶</div>
                  ${ep.thumb
                    ? `<img class="ep-thumb" src="${esc(ep.thumb)}" alt="">`
                    : `<div class="ep-thumb-ph">sem thumb</div>`}
                  <div class="ep-body">
                    <h3>${esc(ep.title || "Episódio")}</h3>
                    <p>${esc(ep.desc || "")}</p>
                  </div>
                  <div class="ep-num">${esc(ep.num || ("EP " + String(ei + 1).padStart(2, "0")))}</div>
                </div>
              `).join("") : `<p class="status">Nenhum episódio nesta temporada.</p>`}
            </div>
          </div>
        </div>
      `;

      el.querySelectorAll(".season-pill").forEach(btn => {
        btn.addEventListener("click", () => {
          activeSeason = parseInt(btn.getAttribute("data-si"), 10) || 0;
          render();
        });
      });
      el.querySelectorAll(".ep-card").forEach(card => {
        card.addEventListener("click", () => {
          const si = parseInt(card.getAttribute("data-si"), 10);
          const ei = parseInt(card.getAttribute("data-ei"), 10);
          const ep = (seasons[si] && seasons[si].episodes || [])[ei];
          if (ep) abrirPlayer(ep);
        });
      });
    }

    window.abrirPlayer = function(ep) {
      const modal = document.getElementById("player-modal");
      const video = document.getElementById("player-video");
      const title = document.getElementById("player-title");
      title.textContent = (ep.num ? ep.num + " — " : "") + (ep.title || "Episódio");
      if (ep.video) {
        video.src = ep.video;
        modal.classList.add("show");
        video.play().catch(() => {});
      } else {
        alert("Este episódio ainda não tem vídeo cadastrado.");
      }
    };
    window.fecharPlayer = function() {
      const modal = document.getElementById("player-modal");
      const video = document.getElementById("player-video");
      video.pause();
      video.removeAttribute("src");
      video.load();
      modal.classList.remove("show");
    };
    document.getElementById("player-modal").addEventListener("click", (e) => {
      if (e.target.id === "player-modal") fecharPlayer();
    });


    async function loadAdsSerie(db) {
      try {
        const snap = await getDoc(doc(db, "configuracoes", "site"));
        if (!snap.exists()) return;
        const data = snap.data();
        const grid = document.getElementById("ads-grid-serie");
        const section = document.getElementById("ads-section-serie");
        if (!grid || !section) return;
        let html = "";
        [13,14,15,16].forEach(n => {
          const p = "an" + n + "_";
          if (data[p + "exibir"] !== true) return;
          const imgs = [data[p+"img1"], data[p+"img2"], data[p+"img3"]].filter(Boolean);
          if (!imgs.length) return;
          const link = data[p+"link"] || "#";
          const title = data[p+"titulo"] || "";
          html += '<div class="ad-slot" title="'+esc(title)+'"><a href="'+esc(link)+'" target="_blank" rel="noopener"><img src="'+esc(imgs[0])+'" alt="'+esc(title)+'" loading="lazy"></a></div>';
        });
        if (html) { grid.innerHTML = html; section.style.display = "block"; }
      } catch (e) { console.warn(e); }
    }

    loadSerie().then(async data => {
      serieData = data;
      render();
      try {
        let app;
        try { const r = await fetch("/__/firebase/init.json"); if (r.ok) app = initializeApp(await r.json(), "ads"); } catch(_){}
        if (!app) { try { app = initializeApp(firebaseConfig, "ads"); } catch(_) { app = initializeApp(firebaseConfig); } }
        const db = getFirestore(app);
        await loadAdsSerie(db);
      } catch (e) { console.warn("ads", e); }
    }).catch(err => {
      console.error(err);
      document.getElementById("content").className = "status error";
      document.getElementById("content").textContent = "Erro ao carregar: " + (err.message || err);
    });
  </script>
</body>
</html>
