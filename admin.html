<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo - Império</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; color: #333; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1 { margin-bottom: 20px; color: #1a252f; font-size: 24px; }
    
    /* Tabs */
    .tabs { display: flex; border-bottom: 2px solid #e0e0e0; margin-bottom: 20px; gap: 10px; }
    .tab-btn { padding: 10px 20px; border: none; background: none; font-size: 16px; font-weight: 600; color: #666; cursor: pointer; border-bottom: 3px solid transparent; }
    .tab-btn.active { color: #2196F3; border-bottom-color: #2196F3; }

    /* Table */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background-color: #f8f9fa; color: #555; font-size: 14px; }
    tr:hover { background-color: #f1f1f1; }

    /* Buttons & Badges */
    .btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: #fff; font-size: 13px; }
    .btn-gerar { background-color: #2196F3; }
    .btn-gerar:hover { background-color: #1e88e5; }
    .badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .badge-solicitado { background: #fff3cd; color: #856404; }
    .badge-teste { background: #d4edda; color: #155724; }

    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal { background: #fff; padding: 25px; border-radius: 8px; width: 100%; max-width: 450px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    .modal h3 { margin-bottom: 15px; color: #333; }
    .modal select { width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .btn-cancelar { background-color: #6c757d; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Painel de Gestão de Leads</h1>

    <div class="tabs">
      <button class="tab-btn active" onclick="alterarAba('solicitacoes')">Solicitações</button>
      <button class="tab-btn" onclick="alterarAba('testes')">Testes Gerados</button>
    </div>

    <table id="tabela-leads">
      <thead>
        <tr>
          <th>Nome</th>
          <th>WhatsApp</th>
          <th>Servidor</th>
          <th>Data</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="lista-leads">
        <tr><td colspan="6">Carregando dados...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Modal Seleção de Servidor -->
  <div class="modal-overlay" id="modal-server">
    <div class="modal">
      <h3>Selecionar Servidor para Teste</h3>
      <select id="server-api-select">
        <option value="https://painelmaster.top/api/chatbot/gerar/318243391">Painel Master</option>
        <option value="https://painelsigma.top/api/chatbot/gerar/318243391">Painel Sigma</option>
        <option value="https://paineltitan.top/api/chatbot/gerar/318243391">Painel Titan</option>
      </select>
      <div class="modal-actions">
        <button class="btn btn-cancelar" onclick="fecharModalServer()">Cancelar</button>
        <button class="btn btn-gerar" onclick="executarGerarTesteAPI()">Confirmar e Gerar</button>
      </div>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Suas configurações do Firebase
    const firebaseConfig = {
      apiKey: "Sua-ApiKey-Aqui",
      authDomain: "imperio-25340.firebaseapp.com",
      projectId: "imperio-25340",
      storageBucket: "imperio-25340.appspot.com",
      messagingSenderId: "305282928509",
      appId: "1:305282928509:web:5d2edc0b6238b1f50a4ad6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentTab = 'solicitacoes';
    let currentSelectedIdForTest = null;

    // Função para carregar os Leads do Firestore
    window.loadLeads = async function() {
      const tbody = document.getElementById('lista-leads');
      tbody.innerHTML = '<tr><td colspan="6">Carregando...</td></tr>';

      try {
        const statusBusca = currentTab === 'solicitacoes' ? 'solicitado' : 'teste';
        const q = query(collection(db, "leads"), where("status", "==", statusBusca));
        const querySnapshot = await getDocs(q);

        tbody.innerHTML = '';

        if (querySnapshot.empty) {
          tbody.innerHTML = `<tr><td colspan="6">Nenhum registro encontrado em ${currentTab}.</td></tr>`;
          return;
        }

        querySnapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const id = docSnap.id;

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${data.nome || 'Não informado'}</td>
            <td>${data.whatsapp || 'Não informado'}</td>
            <td>${data.servidor || '-'}</td>
            <td>${data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleString('pt-BR') : '-'}</td>
            <td><span class="badge ${data.status === 'solicitado' ? 'badge-solicitado' : 'badge-teste'}">${data.status}</span></td>
            <td>
              ${data.status === 'solicitado' 
                ? `<button class="btn btn-gerar" onclick="abrirModalServer('${id}')">Gerar Teste</button>` 
                : `<span style="color:#28a745; font-size:12px; font-weight:bold;">Gerado</span>`}
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error("Erro ao carregar leads:", err);
        tbody.innerHTML = '<tr><td colspan="6">Erro ao carregar dados.</td></tr>';
      }
    };

    // Alternar entre Abas
    window.alterarAba = function(aba) {
      currentTab = aba;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      loadLeads();
    };

    // Controle do Modal
    window.abrirModalServer = function(id) {
      currentSelectedIdForTest = id;
      document.getElementById('modal-server').style.display = 'flex';
    };

    window.fecharModalServer = function() {
      currentSelectedIdForTest = null;
      document.getElementById('modal-server').style.display = 'none';
    };

    // Função Principal de Gerar o Teste via API
    window.executarGerarTesteAPI = async function() {
      if (!currentSelectedIdForTest) return;

      const selectElem = document.getElementById('server-api-select');
      const apiUrl = selectElem.value;
      const nomeServidor = selectElem.options[selectElem.selectedIndex].text;

      // 1. Abre a URL da API do robô em uma nova aba
      window.open(apiUrl, '_blank');

      try {
        // 2. Atualiza o status do cliente diretamente no Firebase para 'teste'
        await updateDoc(doc(db, "leads", currentSelectedIdForTest), {
          status: 'teste',
          servidor: nomeServidor,
          usuario: 'Ver na aba aberta',
          senha: 'Ver na aba aberta',
          vencimento: '4 Horas',
          dataGeracaoTeste: new Date().toLocaleDateString('pt-BR') + ' ' + new Date().toLocaleTimeString('pt-BR'),
          updatedAt: new Date()
        });

        alert("✅ Solicitação processada!\nO teste foi gerado na aba ao lado e o cliente foi movido para 'Testes Gerados'.");
        fecharModalServer();
        loadLeads();
      } catch (err) {
        console.error("Erro ao atualizar o Firebase:", err);
        alert("❌ Erro ao mover o cliente de aba.");
      }
    };

    // Inicializa a listagem ao carregar a página
    loadLeads();
  </script>
</body>
</html>
