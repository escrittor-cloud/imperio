<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin - Império do Streaming</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #121212; color: #fff; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 900px; background: #1e1e1e; padding: 25px; border-radius: 12px; border: 1px solid #333; }
    h2 { color: #e50914; margin-bottom: 20px; text-align: center; }
    .login-box { display: flex; flex-direction: column; gap: 15px; max-width: 400px; margin: 0 auto; }
    .hidden { display: none; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #333; padding-bottom: 10px; }
    .tab-btn { background: #2a2a2a; color: #888; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .tab-btn.active { background: #e50914; color: #fff; }
    .form-group { margin-bottom: 15px; text-align: left; }
    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; color: #ccc; }
    input[type="text"], input[type="password"], textarea { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 1rem; }
    textarea { height: 90px; resize: vertical; }
    .checkbox-container { display: flex; align-items: center; gap: 10px; background: #2a2a2a; padding: 12px; border-radius: 6px; border: 1px solid #444; margin-bottom: 20px; cursor: pointer; }
    .checkbox-container input { width: 20px; height: 20px; accent-color: #e50914; cursor: pointer; }
    .btn { background: #e50914; color: #fff; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: background 0.2s; width: 100%; }
    .btn:hover { background: #ff0f1a; }
    .btn-whatsapp { background: #25d366; color: #fff; text-decoration: none; padding: 6px 12px; border-radius: 4px; font-size: 0.85rem; font-weight: bold; display: inline-block; }
    .table-responsive { overflow-x: auto; margin-top: 15px; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px; border-bottom: 1px solid #333; font-size: 0.9rem; }
    th { background-color: #2a2a2a; color: #e50914; }
    tr:hover { background-color: #252525; }
    .status { margin-top: 15px; text-align: center; font-weight: bold; color: #4caf50; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Painel Administrativo - Império do Streaming</h2>

    <!-- Login -->
    <div id="login-section" class="login-box">
      <div class="form-group">
        <label>Usuário</label>
        <input type="text" id="username" placeholder="Digite o usuário">
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="password" placeholder="Digite a senha">
      </div>
      <button class="btn" onclick="login()">Entrar</button>
      <p id="login-err" style="color: red; text-align: center; margin-top: 10px;"></p>
    </div>

    <!-- Admin Body -->
    <div id="admin-section" class="hidden">
      <div class="tabs">
        <button class="tab-btn active" id="tab-leads-btn" onclick="switchTab('leads')">📋 Lista de Clientes</button>
        <button class="tab-btn" id="tab-config-btn" onclick="switchTab('config')">⚙️ Editar Promoção</button>
      </div>

      <!-- ABA LEADS -->
      <div id="tab-leads">
        <h3>Solicitações de Teste Grátis</h3>
        <br>
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Data</th>
                <th>Nome</th>
                <th>WhatsApp</th>
                <th>Dispositivo</th>
                <th>Ação</th>
              </tr>
            </thead>
            <tbody id="leads-table-body">
              <tr><td colspan="5" style="text-align: center;">Carregando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- ABA PROMOÇÃO -->
      <div id="tab-config" class="hidden">
        <h3>Editar Banners e Textos</h3>
        <br>
        
        <!-- Caixa de Seleção para Exibir / Ocultar Imagens -->
        <label class="checkbox-container">
          <input type="checkbox" id="show-images-toggle">
          <span><strong>Exibir Banners em Destaque no Site</strong> (Alternar até 3 imagens acima do texto)</span>
        </label>

        <div class="form-group">
          <label>Título Principal</label>
          <input type="text" id="title-input">
        </div>
        <div class="form-group">
          <label>Subtexto / Descrição</label>
          <textarea id="subtext-input"></textarea>
        </div>

        <hr style="border-color: #333; margin: 20px 0;">
        <h4>URLs das Imagens (Até 3 imagens 300x300)</h4>
        <br>

        <div class="form-group">
          <label>Imagem 1 (URL)</label>
          <input type="text" id="img1-input" placeholder="https://exemplo.com/imagem1.jpg">
        </div>
        <div class="form-group">
          <label>Imagem 2 (URL)</label>
          <input type="text" id="img2-input" placeholder="https://exemplo.com/imagem2.jpg">
        </div>
        <div class="form-group">
          <label>Imagem 3 (URL)</label>
          <input type="text" id="img3-input" placeholder="https://exemplo.com/imagem3.jpg">
        </div>

        <button class="btn" onclick="saveChanges()">Salvar Alterações</button>
        <div id="status-msg" class="status"></div>
      </div>

    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = { projectId: "imperio-25340" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.login = function() {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;

      if (u === "edan3" && p === "32739532") {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('admin-section').classList.remove('hidden');
        loadLeads();
        loadAdminData();
      } else {
        document.getElementById('login-err').innerText = "Usuário ou senha incorretos!";
      }
    }

    window.switchTab = function(tabName) {
      if (tabName === 'leads') {
        document.getElementById('tab-leads').classList.remove('hidden');
        document.getElementById('tab-config').classList.add('hidden');
        document.getElementById('tab-leads-btn').classList.add('active');
        document.getElementById('tab-config-btn').classList.remove('active');
      } else {
        document.getElementById('tab-config').classList.remove('hidden');
        document.getElementById('tab-leads').classList.add('hidden');
        document.getElementById('tab-config-btn').classList.add('active');
        document.getElementById('tab-leads-btn').classList.remove('active');
      }
    }

    async function loadLeads() {
      const tableBody = document.getElementById('leads-table-body');
      try {
        const q = query(collection(db, "leads"), orderBy("createdAt", "desc"));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #888;">Nenhuma solicitação até o momento.</td></tr>`;
          return;
        }

        tableBody.innerHTML = '';
        querySnapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const date = data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleString('pt-BR') : 'N/A';
          const cleanPhone = (data.whatsapp || '').replace(/\D/g, '');

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${date}</td>
            <td><strong>${data.nome || 'Não informado'}</strong></td>
            <td>${data.whatsapp || 'N/A'}</td>
            <td>${data.dispositivo || 'N/A'}</td>
            <td>
              ${cleanPhone ? `<a href="https://wa.me/55${cleanPhone}?text=Olá%20${encodeURIComponent(data.nome || '')},%20vi%20seu%20pedido%20de%20teste%20grátis!" target="_blank" class="btn-whatsapp">WhatsApp</a>` : '-'}
            </td>
          `;
          tableBody.appendChild(tr);
        });
      } catch (e) {
        console.error("Erro ao carregar leads:", e);
      }
    }

    async function loadAdminData() {
      try {
        const docRef = doc(db, "config", "home");
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const data = docSnap.data();
          document.getElementById('show-images-toggle').checked = data.showImages === true;
          document.getElementById('title-input').value = data.title || '';
          document.getElementById('subtext-input').value = data.subtext || '';
          document.getElementById('img1-input').value = data.img1 || '';
          document.getElementById('img2-input').value = data.img2 || '';
          document.getElementById('img3-input').value = data.img3 || '';
        }
      } catch (e) {
        console.error("Erro ao carregar dados:", e);
      }
    }

    window.saveChanges = async function() {
      const statusMsg = document.getElementById('status-msg');
      statusMsg.innerText = "Salvando...";

      try {
        await setDoc(doc(db, "config", "home"), {
          showImages: document.getElementById('show-images-toggle').checked,
          title: document.getElementById('title-input').value,
          subtext: document.getElementById('subtext-input').value,
          img1: document.getElementById('img1-input').value,
          img2: document.getElementById('img2-input').value,
          img3: document.getElementById('img3-input').value,
          updatedAt: new Date()
        });

        statusMsg.innerText = "✅ Alterações salvas com sucesso!";
        setTimeout(() => statusMsg.innerText = '', 4000);
      } catch (e) {
        console.error("Erro ao salvar:", e);
        statusMsg.style.color = "red";
        statusMsg.innerText = "❌ Erro ao salvar alterações.";
      }
    }
  </script>
</body>
</html>
