<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Império do Streaming</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0d0d0d; color: #ffffff; text-align: center; display: flex; flex-direction: column; min-height: 100vh; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background-color: #000; border-bottom: 1px solid #1a1a1a; }
    .logo { color: #e50914; font-size: 1.2rem; font-weight: bold; text-align: left; line-height: 1.2; text-transform: uppercase; letter-spacing: 1px; }
    .btn-top { background-color: #e50914; color: #fff; padding: 10px 15px; border-radius: 6px; font-weight: bold; text-decoration: none; font-size: 0.85rem; }

    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 20px; max-width: 800px; margin: 0 auto; width: 100%; }

    .promo-slider-container {
      position: relative;
      width: 100%;
      max-width: 300px;
      height: 300px;
      margin: 0 auto 25px auto;
      overflow: hidden;
      border-radius: 12px;
      border: 2px solid #222;
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3);
      display: none;
    }

    .promo-slider-container img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }

    .promo-slider-container img.active { opacity: 1; }

    h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 15px; line-height: 1.3; }
    p.subtext { color: #aaaaaa; font-size: 1rem; margin-bottom: 25px; line-height: 1.5; max-width: 600px; }

    .btn-main { background-color: #e50914; color: #fff; padding: 16px 32px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; text-decoration: none; border: none; cursor: pointer; width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(229, 9, 20, 0.4); display: block; margin-bottom: 30px; }

    /* Form do Teste Grátis */
    .form-card { background: #181818; border: 1px solid #282828; border-radius: 12px; padding: 20px; width: 100%; max-width: 450px; text-align: left; }
    .form-card h2 { color: #fff; font-size: 1.3rem; margin-bottom: 15px; text-align: center; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; color: #ccc; margin-bottom: 5px; }
    .form-group input, .form-group select { width: 100%; padding: 12px; background: #242424; border: 1px solid #333; border-radius: 6px; color: #fff; font-size: 0.95rem; }
    .btn-submit { background: #e50914; color: #fff; font-weight: bold; padding: 14px; border: none; border-radius: 6px; width: 100%; font-size: 1rem; cursor: pointer; margin-top: 10px; }
    .form-msg { text-align: center; margin-top: 10px; font-size: 0.9rem; }

    footer { padding: 20px; background-color: #050505; color: #555; font-size: 0.8rem; margin-top: auto; }
  </style>
</head>
<body>

  <header>
    <div class="logo">Império do<br>Streaming</div>
    <a href="#form-teste" class="btn-top">Testar<br>Agora</a>
  </header>

  <main>
    <div class="promo-slider-container" id="slider-container"></div>

    <h1 id="promo-title">Mais de 30.000 Conteúdos ao Seu Alcance</h1>
    <p class="subtext" id="promo-subtext">Filmes, séries, canais ao vivo, jogos e esportes na sua TV, celular ou computador.</p>

    <a href="#form-teste" class="btn-main">Quero meu teste grátis</a>

    <div class="form-card" id="form-teste">
      <h2>Cadastre-se para o Teste Grátis (4H)</h2>
      <form id="lead-form">
        <div class="form-group">
          <label>Nome Completo</label>
          <input type="text" id="nome" required placeholder="Seu nome">
        </div>
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" id="email" required placeholder="seuemail@gmail.com">
        </div>
        <div class="form-group">
          <label>WhatsApp</label>
          <input type="tel" id="whatsapp" required placeholder="(00) 00000-0000">
        </div>
        <div class="form-group">
          <label>Cidade</label>
          <input type="text" id="cidade" required placeholder="Sua cidade - UF">
        </div>
        <div class="form-group">
          <label>Dispositivo Principal</label>
          <select id="dispositivo">
            <option value="Smart TV">Smart TV</option>
            <option value="TV Box / Firestick">TV Box / Firestick</option>
            <option value="Celular (Android/iOS)">Celular (Android/iOS)</option>
            <option value="Computador / Notebook">Computador / Notebook</option>
          </select>
        </div>
        <button type="submit" class="btn-submit">SOLICITAR TESTE GRÁTIS</button>
        <div id="form-status" class="form-msg"></div>
      </form>
    </div>
  </main>

  <footer>&copy; Império do Streaming</footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = { projectId: "imperio-25340" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let slideIndex = 0;
    let slideInterval;

    // Escuta alterações no Firestore em Tempo Real
    onSnapshot(doc(db, "config", "home"), (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        if (data.title) document.getElementById('promo-title').innerText = data.title;
        if (data.subtext) document.getElementById('promo-subtext').innerText = data.subtext;

        const container = document.getElementById('slider-container');
        container.innerHTML = '';

        if (data.showImages === true) {
          const images = [data.img1, data.img2, data.img3].filter(url => url && url.trim() !== '');
          if (images.length > 0) {
            container.style.display = 'block';
            images.forEach((url, idx) => {
              const img = document.createElement('img');
              img.src = url;
              if (idx === 0) img.classList.add('active');
              container.appendChild(img);
            });

            if (images.length > 1) {
              if (slideInterval) clearInterval(slideInterval);
              slideIndex = 0;
              slideInterval = setInterval(() => {
                const imgElements = container.querySelectorAll('img');
                if(imgElements.length > 0) {
                  imgElements[slideIndex].classList.remove('active');
                  slideIndex = (slideIndex + 1) % imgElements.length;
                  imgElements[slideIndex].classList.add('active');
                }
              }, 3000);
            }
          } else { container.style.display = 'none'; }
        } else { container.style.display = 'none'; }
      }
    });

    // Envio de Leads do Teste
    document.getElementById('lead-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('form-status');
      status.style.color = '#fff';
      status.innerText = 'Enviando...';

      try {
        await addDoc(collection(db, "leads"), {
          nome: document.getElementById('nome').value,
          email: document.getElementById('email').value,
          whatsapp: document.getElementById('whatsapp').value,
          cidade: document.getElementById('cidade').value,
          dispositivo: document.getElementById('dispositivo').value,
          createdAt: serverTimestamp()
        });
        status.style.color = '#25d366';
        status.innerText = '✅ Solicitação enviada! Entraremos em contato.';
        document.getElementById('lead-form').reset();
      } catch (err) {
        status.style.color = '#e50914';
        status.innerText = '❌ Erro ao enviar solicitação.';
      }
    });
  </script>
</body>
</html>
