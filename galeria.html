<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria de Imagens - Império do Streaming</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b0c10; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding-bottom: 50px; }
    .header-nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: rgba(15, 16, 20, 0.95); border-bottom: 1px solid rgba(255, 255, 255, 0.08); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); flex-wrap: wrap; gap: 15px; }
    .logo { font-size: 1.4rem; font-weight: 900; color: #e50914; text-transform: uppercase; letter-spacing: 1px; text-decoration: none; }
    .nav-links { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .nav-btn { padding: 8px 16px; border-radius: 20px; text-decoration: none; font-size: 0.9rem; font-weight: 600; color: #fff; transition: opacity 0.3s; }
    .nav-btn:hover { opacity: 0.85; }
    .btn-home { background: #1f222d; }
    .btn-fb { background: #1877f2; }
    .btn-whats { background: #25d366; }
    .btn-test { background: #e50914; font-weight: 700; }
    .btn-videos { background: #2b70ff; }
    .btn-galeria { background: #8a2be2; }
    .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
    .gallery-title { text-align: center; font-size: 2.2rem; font-weight: 800; margin-bottom: 25px; background: linear-gradient(90deg, #fff, #bbb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .filter-tabs { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 35px; }
    .filter-btn { background: #161822; color: #aaa; border: 1px solid #2a2e3d; padding: 9px 20px; border-radius: 25px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .filter-btn:hover { color: #fff; border-color: #e50914; }
    .filter-btn.active { background: #e50914; color: #fff; border-color: #e50914; box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4); }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 22px; }
    .gallery-card { background: #14161f; border-radius: 14px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.05); transition: transform 0.3s, box-shadow 0.3s; cursor: pointer; }
    .gallery-card:hover { transform: translateY(-6px); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6); border-color: rgba(229, 9, 20, 0.4); }
    .card-img-wrap { width: 100%; height: 340px; overflow: hidden; background: #0d0e14; display: flex; align-items: center; justify-content: center; }
    .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
    .gallery-card:hover .card-img-wrap img { transform: scale(1.05); }
    .card-info { padding: 14px 16px; }
    .card-title { font-size: 1rem; font-weight: 700; margin: 0 0 4px 0; color: #fff; }
    .card-tag { font-size: 0.75rem; text-transform: uppercase; font-weight: 700; color: #e50914; letter-spacing: 0.5px; }
    footer { text-align: center; padding: 30px 20px; color: #777; font-size: 0.9rem; border-top: 1px solid rgba(255,255,255,0.05); margin-top: 60px; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.92); z-index: 1000; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
    .modal.active { display: flex; }
    .modal-img { max-width: 90%; max-height: 85vh; border-radius: 8px; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
    .modal-close { position: absolute; top: 25px; right: 35px; color: #fff; font-size: 2rem; cursor: pointer; }
  </style>
</head>
<body>
  <header class="header-nav">
    <a href="indexnew.html" class="logo">Império do Streaming</a>
    <div class="nav-links">
      <a href="indexnew.html" class="nav-btn btn-home">Home</a>
      <a href="#" class="nav-btn btn-fb">Facebook</a>
      <a href="#" class="nav-btn btn-whats">WhatsApp</a>
      <a href="#" class="nav-btn btn-test">Testar Agora</a>
      <a href="#" class="nav-btn btn-videos">Vídeos</a>
      <a href="galeria.html" class="nav-btn btn-galeria">Galeria</a>
    </div>
  </header>

  <div class="container">
    <h1 class="gallery-title">Galeria Oficial</h1>
    <div class="filter-tabs">
      <button class="filter-btn active" onclick="filtrarGaleria('todos', this)">Todos</button>
      <button class="filter-btn" onclick="filtrarGaleria('heroi', this)">Herói</button>
      <button class="filter-btn" onclick="filtrarGaleria('viloes', this)">Vilões</button>
      <button class="filter-btn" onclick="filtrarGaleria('posters', this)">Posters</button>
      <button class="filter-btn" onclick="filtrarGaleria('tirinhas', this)">Tirinhas</button>
      <button class="filter-btn" onclick="filtrarGaleria('personagens', this)">Personagens</button>
      <button class="filter-btn" onclick="filtrarGaleria('making-off', this)">Making of</button>
    </div>
    <div class="gallery-grid" id="galleryGrid">
      <p style="text-align:center; grid-column: 1/-1; color:#888;">A carregar galeria...</p>
    </div>
  </div>

  <footer>
    <div style="text-align: center; padding: 15px; color: #888; font-size: 13px; font-weight: bold;">
      👁️ Visitantes: <span id="contador-visitas" style="color: #25D366;">...</span>
    </div>
    <p>&copy; 2026 Império do Streaming. Todos os direitos reservados.</p>
  </footer>

  <div class="modal" id="imageModal" onclick="fecharModal()">
    <span class="modal-close">&times;</span>
    <img src="" id="modalImg" class="modal-img">
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = { projectId: "imperio-25340", authDomain: "imperio-25340.firebaseapp.com" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let todasImagens = [];

    async function carregarGaleria() {
      const grid = document.getElementById("galleryGrid");
      try {
        const urlParams = new URLSearchParams(window.location.search);
        let serieId = urlParams.get('id');
        if (!serieId) {
            serieId = 'super-stream';
        }

        todasImagens = [];

        // Lê da nova coleção 'galeria' do Firestore
        const snapLote = await getDocs(collection(db, "galeria"));
        if (!snapLote.empty) {
          snapLote.forEach(doc => {
            const data = doc.data();
            if (!data.serieId || data.serieId === serieId) {
              todasImagens.push({
                url: data.url,
                title: data.title || 'Imagem',
                categoria: (data.categorias && data.categorias.length > 0) ? data.categorias[0] : 'geral'
              });
            }
          });
        }

        // Fallback para a estrutura antiga se a coleção estiver vazia
        if (todasImagens.length === 0) {
          const serieSnap = await getDoc(doc(db, "series", serieId));
          if (serieSnap.exists() && serieSnap.data().gallery) {
            todasImagens = serieSnap.data().gallery;
          }
        }

        renderizarImagens(todasImagens);
      } catch (err) {
        console.error("Erro ao carregar imagens:", err);
        grid.innerHTML = "<p style='text-align:center; grid-column:1/-1; color:#e50914;'>Erro ao carregar a galeria.</p>";
      }
    }

    function renderizarImagens(itens) {
      const grid = document.getElementById("galleryGrid");
      grid.innerHTML = "";
      if (!itens || itens.length === 0) {
        grid.innerHTML = "<p style='text-align:center; grid-column:1/-1; color:#888;'>Nenhuma imagem encontrada nesta categoria.</p>";
        return;
      }
      itens.forEach(img => {
        const card = document.createElement("div");
        card.className = "gallery-card";
        card.onclick = () => abrirModal(img.url);
        card.innerHTML = `
          <div class="card-img-wrap">
            <img src="${img.url}" alt="${img.title || 'Imagem'}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x400?text=Sem+Imagem'">
          </div>
          <div class="card-info">
            <div class="card-tag">${img.categoria || 'Geral'}</div>
            <h3 class="card-title">${img.title || ''}</h3>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    window.filtrarGaleria = function(cat, btn) {
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      if (cat === "todos") {
        renderizarImagens(todasImagens);
      } else {
        const filtradas = todasImagens.filter(item => (item.categoria || "").toLowerCase() === cat.toLowerCase());
        renderizarImagens(filtradas);
      }
    };

    window.abrirModal = function(url) {
      document.getElementById("modalImg").src = url;
      document.getElementById("imageModal").classList.add("active");
    };
    window.fecharModal = function() {
      document.getElementById("imageModal").classList.remove("active");
    };

    carregarGaleria();
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      authDomain: "imperio-25340.firebaseapp.com",
      projectId: "imperio-25340",
      storageBucket: "imperio-25340.appspot.com",
      messagingSenderId: "305282928509",
      appId: "1:305282928509:web:5d2edc0b6238b1f50a4ad6"
    };

    const app = initializeApp(firebaseConfig, "appContador");
    const db = getFirestore(app);

    async function gerenciarVisitas() {
      const docRef = doc(db, "estatisticas", "geral");
      const agora = new Date().getTime();
      const ultimaVisita = localStorage.getItem('ultima_visita_imperio');
      const tempoDeEspera = 30 * 60 * 1000;

      if (!ultimaVisita || (agora - parseInt(ultimaVisita)) > tempoDeEspera) {
        try {
          await setDoc(docRef, { visitas_totais: increment(1) }, { merge: true });
          localStorage.setItem('ultima_visita_imperio', agora.toString());
        } catch (erro) { console.error(erro); }
      }
      try {
        const snap = await getDoc(docRef);
        if (snap.exists()) {
          const el = document.getElementById('contador-visitas');
          if (el) el.innerText = (snap.data().visitas_totais || 0).toLocaleString('pt-BR');
        }
      } catch (e) { console.warn(e); }
    }
    gerenciarVisitas();
  </script>
</body>
</html>
