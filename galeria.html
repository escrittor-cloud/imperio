<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria de Imagens - Império do Streaming</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0b0c10;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding-bottom: 50px;
    }
    .header-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 5%;
      background: rgba(15, 16, 20, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .logo {
      font-size: 1.4rem;
      font-weight: 900;
      color: #e50914;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-decoration: none;
    }
    .btn-voltar {
      background: #1f222d;
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
    }
    .btn-voltar:hover {
      background: #e50914;
    }
    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .gallery-title {
      text-align: center;
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 25px;
      background: linear-gradient(90deg, #fff, #bbb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    /* Filtros por abas */
    .filter-tabs {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 35px;
    }
    .filter-btn {
      background: #161822;
      color: #aaa;
      border: 1px solid #2a2e3d;
      padding: 9px 20px;
      border-radius: 25px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .filter-btn:hover {
      color: #fff;
      border-color: #e50914;
    }
    .filter-btn.active {
      background: #e50914;
      color: #fff;
      border-color: #e50914;
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
    }
    /* Grade de Imagens */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 22px;
    }
    .gallery-card {
      background: #14161f;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
    }
    .gallery-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      border-color: rgba(229, 9, 20, 0.4);
    }
    .card-img-wrap {
      width: 100%;
      height: 340px;
      overflow: hidden;
      background: #0d0e14;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s;
    }
    .gallery-card:hover .card-img-wrap img {
      transform: scale(1.05);
    }
    .card-info {
      padding: 14px 16px;
    }
    .card-title {
      font-size: 1rem;
      font-weight: 700;
      margin: 0 0 4px 0;
      color: #fff;
    }
    .card-tag {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
      color: #e50914;
      letter-spacing: 0.5px;
    }
    /* Modal de Zoom */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.92);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .modal.active {
      display: flex;
    }
    .modal-img {
      max-width: 90%;
      max-height: 85vh;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
    }
    .modal-close {
      position: absolute;
      top: 25px;
      right: 35px;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header class="header-nav">
    <a href="indexnew.html" class="logo">Império do Streaming</a>
    <a href="serie.html?id=super-stream" class="btn-voltar"><i class="fa-solid fa-arrow-left"></i> Voltar à Série</a>
  </header>

  <div class="container">
    <h1 class="gallery-title">Galeria Oficial</h1>

    <!-- Abas de Filtros -->
    <div class="filter-tabs">
      <button class="filter-btn active" onclick="filtrarGaleria('todos', this)">Todos</button>
      <button class="filter-btn" onclick="filtrarGaleria('heroi', this)">Herói</button>
      <button class="filter-btn" onclick="filtrarGaleria('viloes', this)">Vilões</button>
      <button class="filter-btn" onclick="filtrarGaleria('posters', this)">Posters</button>
      <button class="filter-btn" onclick="filtrarGaleria('tirinhas', this)">Tirinhas</button>
      <button class="filter-btn" onclick="filtrarGaleria('personagens', this)">Personagens</button>
      <button class="filter-btn" onclick="filtrarGaleria('making-off', this)">Making of</button>
    </div>

    <!-- Grade -->
    <div class="gallery-grid" id="galleryGrid">
      <p style="text-align:center; grid-column: 1/-1; color:#888;">A carregar galeria...</p>
    </div>
  </div>

  <!-- Modal para visualização ampliada -->
  <div class="modal" id="imageModal" onclick="fecharModal()">
    <span class="modal-close">&times;</span>
    <img src="" id="modalImg" class="modal-img">
  </div>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Inicialização direta do Firebase usando a mesma configuração do projeto
    const firebaseConfig = {
      projectId: "imperio-25340",
      authDomain: "imperio-25340.firebaseapp.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let todasImagens = [];

    async function carregarGaleria() {
      const grid = document.getElementById("galleryGrid");
      try {
        const snap = await getDoc(doc(db, "config", "galeria"));
        if (snap.exists() && snap.data().items) {
          todasImagens = snap.data().items;
        } else {
          // Backup na coleção de séries caso não esteja em config
          const serieSnap = await getDoc(doc(db, "series", "super-stream"));
          if (serieSnap.exists() && serieSnap.data().gallery) {
            todasImagens = serieSnap.data().gallery;
          }
        }

        renderizarImagens(todasImagens);
      } catch (err) {
        console.error("Erro ao carregar imagens:", err);
        grid.innerHTML = "<p style='text-align:center; grid-column:1/-1; color:#e50914;'>Erro ao carregar a galeria.</p>";
      }
    }

    function renderizarImagens(itens) {
      const grid = document.getElementById("galleryGrid");
      grid.innerHTML = "";

      if (!itens || itens.length === 0) {
        grid.innerHTML = "<p style='text-align:center; grid-column:1/-1; color:#888;'>Nenhuma imagem encontrada nesta categoria.</p>";
        return;
      }

      itens.forEach(img => {
        const card = document.createElement("div");
        card.className = "gallery-card";
        card.onclick = () => abrirModal(img.url);

        card.innerHTML = `
          <div class="card-img-wrap">
            <img src="${img.url}" alt="${img.title || 'Imagem'}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x400?text=Sem+Imagem'">
          </div>
          <div class="card-info">
            <div class="card-tag">${img.categoria || 'Geral'}</div>
            <h3 class="card-title">${img.title || ''}</h3>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    window.filtrarGaleria = function(cat, btn) {
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

      if (cat === "todos") {
        renderizarImagens(todasImagens);
      } else {
        const filtradas = todasImagens.filter(item => (item.categoria || "").toLowerCase() === cat.toLowerCase());
        renderizarImagens(filtradas);
      }
    };

    window.abrirModal = function(url) {
      document.getElementById("modalImg").src = url;
      document.getElementById("imageModal").classList.add("active");
    };

    window.fecharModal = function() {
      document.getElementById("imageModal").classList.remove("active");
    };

    carregarGaleria();
  </script>
</body>
</html>
